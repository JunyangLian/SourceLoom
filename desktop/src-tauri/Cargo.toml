[package]
name = "shiyuan"
version = "0.4.1"
description = "拾源（SourceLoom）：原位知识工作台"
edition = "2021"

[lib]
name = "shiyuan_lib"
# 只做 Windows 桌面端，因此不产出 staticlib/cdylib（那是 Tauri 移动端的要求）；
# MinGW 的 ld 在 cdylib 导出符号序号超过 65535 时会报 "export ordinal too large"。
crate-type = ["rlib"]

# 包名保留 shiyuan（数据目录、MCP 与侧车路径都依赖它），
# 只把用户可见的主程序名改成品牌英文名。
[[bin]]
name = "SourceLoom"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
